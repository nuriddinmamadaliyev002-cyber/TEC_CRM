# panel.todayeducationcentre.uz  Certbot: certbot --nginx -d panel.todayeducationcentre.uz
server {
    listen 80;
    server_name panel.todayeducationcentre.uz;

    root /var/www/TEC/web;
    index index.html;

    # API → Node (port 3010)
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML/JS/CSS keshlanmasin: har safar yangilanganini tekshirsin (ETag → 304).
    # Busiz Cloudflare ularni 4 soat ushlab turadi va pull qilingan yangi kod ko'rinmaydi.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
