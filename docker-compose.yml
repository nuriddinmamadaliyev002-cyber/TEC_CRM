# Today Education Centre — lokal/Docker ishga tushirish
#   1) cp .env.docker.example .env      (ildizdagi .env: faqat DB_PASSWORD)
#   2) backend/.env va bot/.env ni to'ldiring (.env.example'lardan)
#   3) docker compose up -d --build
#   4) http://localhost:3010   (ngrok ham shu portga: ngrok http 3010)
#
# Konteyner ichida quyidagilar .env dagi qiymatlarni BEKOR qiladi (HOST/DB_HOST/API_BASE localhost bo'lsa ishlamaydi).

services:
  db:
    image: postgres:16-alpine
    container_name: today_edu_db
    environment:
      POSTGRES_DB: today_edu
      POSTGRES_USER: today_edu_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ildizdagi .env faylida DB_PASSWORD ni yozing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U today_edu_user -d today_edu"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .                      # web/ papkasi ham image ichiga kirishi uchun ildiz
      dockerfile: backend/Dockerfile
    container_name: today_edu_backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "3010"
      HOST: 0.0.0.0                   # konteynerda 127.0.0.1 tashqaridan ko'rinmaydi
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: today_edu
      DB_USER: today_edu_user
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3010"         # ngrok/brauzer shu portga ulanadi
    command: sh -c "npm run db:setup && npm start"   # sxema (IF NOT EXISTS) + server
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: today_edu_bot
    env_file:
      - ./bot/.env
    environment:
      API_BASE: http://backend:3010/api   # konteynerdan konteynerga: xizmat nomi bilan
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
