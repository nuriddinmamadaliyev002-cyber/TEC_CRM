<html lang="uz">
<head>

  <form id="v-super" novalidate>
    <div class="fld"><label for="u">Username</label><input id="u" autocomplete="username" required></div>

    <p class="muted" style="margin-top:12px">Kurs admin, o'qituvchi va o'quvchilar Telegram botdagi «🔐 Tizimga kirish» tugmasi orqali kiradi.</p></div>

</div></div>
